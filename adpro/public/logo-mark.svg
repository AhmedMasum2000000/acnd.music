<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AD PRO Communications Limited">
  <title>AD PRO Communications Limited</title>
  <!--
    The APCL mark: one droplet silhouette, split into a bright blue left lobe
    and a deep navy right lobe, with a white swoosh sweeping across the base
    and a tail drawn out to the lower left.

    The two lobes share the apex and the outer left edge, so they read as a
    single form rather than two shapes side by side. Redrawn as vector so it
    stays crisp from favicon size up. If an official vector exists, replace
    this file — every reference points at the filename, not at these paths.
  -->
  <defs>
    <linearGradient id="apcl-blue" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#3f88dd"/>
      <stop offset="100%" stop-color="#2464b8"/>
    </linearGradient>
    <linearGradient id="apcl-navy" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a4d83"/>
      <stop offset="100%" stop-color="#1a3055"/>
    </linearGradient>
  </defs>

  <!-- whole droplet, navy: apex, right shoulder, rounded base, tail to the left -->
  <path fill="url(#apcl-navy)"
        d="M256 28
           c46 118 176 244 176 330
           0 84-80 132-176 132
           -74 0-136-34-166-88
           -10-18-20-30-34-42
           124-38 176-186 200-332z"/>

  <!-- blue left lobe: same apex and outer edge, inner edge bulging right -->
  <path fill="url(#apcl-blue)"
        d="M256 28
           c-24 146-76 294-200 332
           14 12 24 24 34 42
           30 54 92 88 166 88
           40-84 40-330 0-462z"/>

  <!-- white swoosh across the base -->
  <path fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"
        d="M92 396c98 40 236 42 330 2"/>
</svg>
