    <linearGradient id="hd-pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#454852"/>
      <stop offset="100%" stop-color="#292b32"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#hd-sky)"/>

  <g fill="#0a0a0d">
