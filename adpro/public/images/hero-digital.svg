<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="A wide digital LED billboard glowing above a busy junction at night">
  <defs>
    <linearGradient id="hd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="55%" stop-color="#111219"/>
      <stop offset="100%" stop-color="#15161b"/>
    </linearGradient>
    <linearGradient id="hd-led" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2fa"/>
