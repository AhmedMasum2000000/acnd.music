<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="A city junction lined with billboards at dusk">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241521"/>
      <stop offset="50%" stop-color="#191420"/>
      <stop offset="100%" stop-color="#15161b"/>
    </linearGradient>
    <linearGradient id="h-poster" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4e2d6"/>
      <stop offset="100%" stop-color="#c9c7ba"/>
    </linearGradient>
    <linearGradient id="h-led" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7edf7"/>
      <stop offset="45%" stop-color="#9fb6d9"/>
      <stop offset="100%" stop-color="#4d6690"/>
    </linearGradient>
    <radialGradient id="h-halo" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#8fb0e0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8fb0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a4d57"/>
      <stop offset="100%" stop-color="#2e3038"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#h-sky)"/>

  <!-- skyline -->
  <g fill="#100e14">
    <rect x="0" y="380" width="90" height="160"/>
    <rect x="100" y="340" width="70" height="200"/>
    <rect x="180" y="400" width="80" height="140"/>
    <rect x="270" y="360" width="55" height="180"/>
    <rect x="1260" y="350" width="70" height="190"/>
    <rect x="1340" y="400" width="90" height="140"/>
    <rect x="1440" y="330" width="60" height="210"/>
    <rect x="1510" y="385" width="90" height="155"/>
  </g>
  <g fill="#d7d5c6" opacity="0.3">
    <rect x="20" y="410" width="7" height="9"/>
    <rect x="40" y="430" width="7" height="9"/>
    <rect x="120" y="370" width="7" height="9"/>
    <rect x="200" y="430" width="7" height="9"/>
    <rect x="1290" y="380" width="7" height="9"/>
    <rect x="1370" y="430" width="7" height="9"/>
    <rect x="1470" y="360" width="7" height="9"/>
  </g>

  <!-- road -->
  <rect x="0" y="540" width="1600" height="160" fill="#101116"/>
  <g stroke="#2a2c33" stroke-width="7" stroke-dasharray="30 26">
    <line x1="0" y1="620" x2="1600" y2="620"/>
  </g>

  <!-- static billboard, left -->
  <rect x="290" y="220" width="16" height="280" fill="url(#h-pole)"/>
  <rect x="410" y="220" width="16" height="280" fill="url(#h-pole)"/>
  <rect x="282" y="210" width="152" height="14" rx="3" fill="url(#h-pole)"/>
  <rect x="262" y="140" width="192" height="115" fill="#0c0d10"/>
  <rect x="270" y="148" width="176" height="99" fill="url(#h-poster)"/>
  <g fill="#8a7f6a" opacity="0.55">
    <rect x="282" y="162" width="64" height="9" rx="2"/>
    <rect x="282" y="178" width="110" height="6" rx="2"/>
  </g>
  <rect x="282" y="198" width="44" height="22" rx="3" fill="#b7412f" opacity="0.75"/>
  <rect x="332" y="198" width="86" height="22" rx="3" fill="#3d4a63" opacity="0.5"/>

  <!-- digital billboard, right -->
  <ellipse cx="1180" cy="230" rx="230" ry="170" fill="url(#h-halo)"/>
  <rect x="1100" y="240" width="16" height="270" fill="url(#h-pole)"/>
  <rect x="1250" y="240" width="16" height="270" fill="url(#h-pole)"/>
  <rect x="1092" y="230" width="182" height="14" rx="3" fill="url(#h-pole)"/>
  <rect x="1064" y="150" width="238" height="130" fill="#0a0a0d"/>
  <rect x="1072" y="158" width="222" height="114" fill="url(#h-led)"/>
  <g stroke="#0a0a0d" stroke-width="1" opacity="0.12">
    <line x1="1072" y1="170" x2="1294" y2="170"/>
    <line x1="1072" y1="182" x2="1294" y2="182"/>
    <line x1="1072" y1="194" x2="1294" y2="194"/>
    <line x1="1072" y1="206" x2="1294" y2="206"/>
    <line x1="1072" y1="218" x2="1294" y2="218"/>
    <line x1="1072" y1="230" x2="1294" y2="230"/>
    <line x1="1072" y1="242" x2="1294" y2="242"/>
    <line x1="1072" y1="254" x2="1294" y2="254"/>
  </g>
  <rect x="1086" y="176" width="90" height="48" rx="4" fill="#1c2536" opacity="0.55"/>
  <rect x="1186" y="176" width="94" height="20" rx="3" fill="#f4f7fc" opacity="0.85"/>
  <rect x="1186" y="204" width="60" height="20" rx="3" fill="#c94b3a" opacity="0.8"/>

  <!-- traffic queue, centered under both -->
  <g>
    <rect x="560" y="590" width="76" height="32" rx="6" fill="#2a1c22"/>
    <circle cx="574" cy="622" r="4.5" fill="#ffe3a3"/>
    <circle cx="622" cy="622" r="4.5" fill="#ffe3a3"/>

    <rect x="690" y="596" width="66" height="28" rx="6" fill="#20222a"/>
    <circle cx="702" cy="624" r="4.5" fill="#ffe3a3"/>
    <circle cx="740" cy="624" r="4.5" fill="#ffe3a3"/>

    <rect x="820" y="588" width="80" height="34" rx="6" fill="#231a1e"/>
    <circle cx="834" cy="622" r="4.5" fill="#ffe3a3"/>
    <circle cx="886" cy="622" r="4.5" fill="#ffe3a3"/>

    <rect x="950" y="594" width="70" height="30" rx="6" fill="#1e2028"/>
    <circle cx="964" cy="624" r="4.5" fill="#eec98a"/>
    <circle cx="1004" cy="624" r="4.5" fill="#eec98a"/>
  </g>
</svg>
