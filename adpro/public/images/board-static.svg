<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Static billboard on a roadside gantry at dusk">
  <defs>
    <linearGradient id="sky-dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241521"/>
      <stop offset="55%" stop-color="#1a1520"/>
      <stop offset="100%" stop-color="#15161b"/>
    </linearGradient>
    <linearGradient id="poster-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4e2d6"/>
      <stop offset="100%" stop-color="#c9c7ba"/>
    </linearGradient>
    <linearGradient id="pole-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a4d57"/>
      <stop offset="100%" stop-color="#2e3038"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky-dusk)"/>

  <!-- distant skyline -->
  <g fill="#100e14">
    <rect x="0" y="330" width="60" height="130"/>
    <rect x="70" y="300" width="45" height="160"/>
    <rect x="125" y="345" width="55" height="115"/>
    <rect x="600" y="315" width="50" height="145"/>
    <rect x="655" y="350" width="60" height="110"/>
    <rect x="720" y="290" width="45" height="170"/>
    <rect x="770" y="335" width="30" height="125"/>
  </g>
  <g fill="#d7d5c6" opacity="0.35">
    <rect x="20" y="360" width="6" height="8"/>
    <rect x="35" y="380" width="6" height="8"/>
    <rect x="90" y="330" width="6" height="8"/>
    <rect x="630" y="345" width="6" height="8"/>
    <rect x="735" y="320" width="6" height="8"/>
  </g>

  <!-- road -->
  <rect x="0" y="460" width="800" height="140" fill="#101116"/>
  <g stroke="#2a2c33" stroke-width="6" stroke-dasharray="26 22">
    <line x1="0" y1="530" x2="800" y2="530"/>
  </g>

  <!-- traffic, abstracted -->
  <g>
    <rect x="60" y="500" width="70" height="30" rx="6" fill="#3a2530"/>
    <circle cx="72" cy="530" r="4" fill="#eec98a"/>
    <circle cx="118" cy="530" r="4" fill="#eec98a"/>

    <rect x="180" y="495" width="60" height="34" rx="6" fill="#26232c"/>
    <circle cx="192" cy="529" r="4" fill="#eec98a"/>
    <circle cx="228" cy="529" r="4" fill="#eec98a"/>

    <rect x="590" y="500" width="66" height="30" rx="6" fill="#2c2733"/>
    <circle cx="602" cy="530" r="4" fill="#e6dfc9"/>
    <circle cx="644" cy="530" r="4" fill="#e6dfc9"/>
  </g>

  <!-- gantry structure -->
  <rect x="330" y="150" width="18" height="310" fill="url(#pole-shade)"/>
  <rect x="452" y="150" width="18" height="310" fill="url(#pole-shade)"/>
  <rect x="322" y="140" width="156" height="14" rx="3" fill="url(#pole-shade)"/>

  <!-- billboard face -->
  <rect x="300" y="70" width="200" height="120" fill="#0c0d10"/>
  <rect x="308" y="78" width="184" height="104" fill="url(#poster-face)"/>

  <!-- abstract layout marks on the poster, not text -->
  <g fill="#8a7f6a" opacity="0.55">
    <rect x="322" y="94" width="70" height="10" rx="2"/>
    <rect x="322" y="112" width="120" height="6" rx="2"/>
    <rect x="322" y="124" width="96" height="6" rx="2"/>
  </g>
  <rect x="322" y="146" width="46" height="24" rx="3" fill="#b7412f" opacity="0.75"/>
  <rect x="376" y="146" width="90" height="24" rx="3" fill="#3d4a63" opacity="0.55"/>
</svg>
