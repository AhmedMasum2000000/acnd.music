<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Digital LED billboard glowing over a busy road at night">
  <defs>
    <linearGradient id="sky-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0c11"/>
      <stop offset="60%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#15161b"/>
    </linearGradient>
    <linearGradient id="led-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7edf7"/>
      <stop offset="45%" stop-color="#9fb6d9"/>
      <stop offset="100%" stop-color="#4d6690"/>
    </linearGradient>
    <radialGradient id="led-halo" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#8fb0e0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8fb0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pole-shade-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#454852"/>
      <stop offset="100%" stop-color="#292b32"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky-night)"/>

  <!-- distant skyline with a few lit windows -->
  <g fill="#0a0a0d">
    <rect x="0" y="320" width="55" height="140"/>
    <rect x="65" y="290" width="50" height="170"/>
    <rect x="130" y="350" width="60" height="110"/>
    <rect x="610" y="300" width="46" height="160"/>
    <rect x="665" y="345" width="60" height="115"/>
    <rect x="735" y="280" width="45" height="180"/>
  </g>
  <g fill="#e9d9a0" opacity="0.5">
    <rect x="18" y="345" width="6" height="7"/>
    <rect x="34" y="365" width="6" height="7"/>
    <rect x="80" y="315" width="6" height="7"/>
    <rect x="95" y="335" width="6" height="7"/>
    <rect x="150" y="370" width="6" height="7"/>
    <rect x="640" y="330" width="6" height="7"/>
    <rect x="690" y="365" width="6" height="7"/>
    <rect x="750" y="310" width="6" height="7"/>
  </g>

  <!-- road -->
  <rect x="0" y="460" width="800" height="140" fill="#0d0e12"/>
  <g stroke="#24262d" stroke-width="6" stroke-dasharray="26 22">
    <line x1="0" y1="530" x2="800" y2="530"/>
  </g>

  <!-- queued traffic, abstracted -->
  <g>
    <rect x="50" y="498" width="70" height="32" rx="6" fill="#20222a"/>
    <circle cx="62" cy="530" r="4" fill="#ffe3a3"/>
    <circle cx="108" cy="530" r="4" fill="#ffe3a3"/>

    <rect x="170" y="503" width="60" height="28" rx="6" fill="#2a1c22"/>
    <circle cx="182" cy="531" r="4" fill="#ffe3a3"/>
    <circle cx="218" cy="531" r="4" fill="#ffe3a3"/>

    <rect x="580" y="500" width="66" height="30" rx="6" fill="#1e2028"/>
    <circle cx="592" cy="530" r="4" fill="#ffe3a3"/>
    <circle cx="634" cy="530" r="4" fill="#ffe3a3"/>

    <rect x="670" y="495" width="72" height="34" rx="6" fill="#231a1e"/>
    <circle cx="682" cy="529" r="4" fill="#ffe3a3"/>
    <circle cx="730" cy="529" r="4" fill="#ffe3a3"/>
  </g>

  <!-- gantry structure -->
  <rect x="320" y="140" width="18" height="320" fill="url(#pole-shade-2)"/>
  <rect x="462" y="140" width="18" height="320" fill="url(#pole-shade-2)"/>
  <rect x="312" y="130" width="176" height="14" rx="3" fill="url(#pole-shade-2)"/>

  <!-- glow halo behind the screen -->
  <ellipse cx="400" cy="150" rx="220" ry="160" fill="url(#led-halo)"/>

  <!-- LED screen -->
  <rect x="284" y="58" width="232" height="130" fill="#0a0a0d"/>
  <rect x="292" y="66" width="216" height="114" fill="url(#led-glow)"/>

  <!-- faint scanlines for an LED read -->
  <g stroke="#0a0a0d" stroke-width="1" opacity="0.12">
    <line x1="292" y1="76" x2="508" y2="76"/>
    <line x1="292" y1="86" x2="508" y2="86"/>
    <line x1="292" y1="96" x2="508" y2="96"/>
    <line x1="292" y1="106" x2="508" y2="106"/>
    <line x1="292" y1="116" x2="508" y2="116"/>
    <line x1="292" y1="126" x2="508" y2="126"/>
    <line x1="292" y1="136" x2="508" y2="136"/>
    <line x1="292" y1="146" x2="508" y2="146"/>
    <line x1="292" y1="156" x2="508" y2="156"/>
    <line x1="292" y1="166" x2="508" y2="166"/>
  </g>

  <!-- abstract "content" blocks on the screen, not text -->
  <rect x="306" y="86" width="88" height="46" rx="4" fill="#1c2536" opacity="0.55"/>
  <rect x="404" y="86" width="90" height="20" rx="3" fill="#f4f7fc" opacity="0.85"/>
  <rect x="404" y="112" width="60" height="20" rx="3" fill="#c94b3a" opacity="0.8"/>
  <rect x="306" y="140" width="188" height="10" rx="3" fill="#0a0a0d" opacity="0.35"/>
</svg>
